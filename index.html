<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="calculator-card">
      <!-- Header with controls -->
      <header class="calculator-header">
        <div class="header-brand">
          <span class="brand-dot"></span>
          <span>CALC</span>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="icon-btn" title="Toggle Theme (T)" aria-label="Toggle theme">
            <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="historyToggle" class="icon-btn" title="History (H)" aria-label="Toggle calculation history">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Display Area -->
      <section class="calculator-display" id="displayArea" title="Click to copy result">
        <div class="history-expression" id="previousExpression" aria-live="polite"></div>
        <div class="current-value-wrapper">
          <div class="current-value" id="currentValue" aria-live="polite">0</div>
        </div>
        <span class="copy-feedback" id="copyFeedback">Copied!</span>
      </section>

      <!-- Secondary functions bar (square, sqrt, power, parens) -->
      <div class="scientific-bar">
        <button class="btn btn-secondary" data-action="parenthesis-open" title="Open Parenthesis">(</button>
        <button class="btn btn-secondary" data-action="parenthesis-close" title="Close Parenthesis">)</button>
        <button class="btn btn-secondary" data-action="power" title="Power (x^y)">xʸ</button>
        <button class="btn btn-secondary" data-action="square-root" title="Square Root">√</button>
        <button class="btn btn-secondary" data-action="square" title="Square (x²)">x²</button>
      </div>

      <!-- Main Keypad -->
      <div class="calculator-keypad">
        <button class="btn btn-function" data-action="clear" title="Clear all (Escape or C)">AC</button>
        <button class="btn btn-function" data-action="backspace" title="Delete (Backspace)">⌫</button>
        <button class="btn btn-function" data-action="percent" title="Percentage (%)">%</button>
        <button class="btn btn-operator" data-action="operator" data-value="÷" title="Divide (/)">÷</button>

        <button class="btn btn-number" data-value="7">7</button>
        <button class="btn btn-number" data-value="8">8</button>
        <button class="btn btn-number" data-value="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="×" title="Multiply (*)">×</button>

        <button class="btn btn-number" data-value="4">4</button>
        <button class="btn btn-number" data-value="5">5</button>
        <button class="btn btn-number" data-value="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="−" title="Subtract (-)">−</button>

        <button class="btn btn-number" data-value="1">1</button>
        <button class="btn btn-number" data-value="2">2</button>
        <button class="btn btn-number" data-value="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+" title="Add (+)">+</button>

        <button class="btn btn-function" data-action="negate" title="Negate value (±)">±</button>
        <button class="btn btn-number" data-value="0">0</button>
        <button class="btn btn-number" data-action="decimal" data-value=".">.</button>
        <button class="btn btn-equals" data-action="equals" title="Calculate (Enter or =)">=</button>
      </div>

      <!-- History Panel Drawer -->
      <aside class="history-panel" id="historyPanel" aria-hidden="true">
        <div class="history-header">
          <h3>History</h3>
          <button id="clearHistoryBtn" class="clear-history-btn" title="Clear all history">Clear</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="history-empty">No calculations yet</p>
        </div>
      </aside>
    </div>

    <footer class="app-footer">
      <p>Keyboard friendly • Click display to copy</p>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
